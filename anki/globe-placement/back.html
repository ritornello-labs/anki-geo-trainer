<div class="ig-card" data-island-globe data-side="back" data-family="place" data-key="{{Key}}">
  <div class="ig-mast"><span>GeoTrainer</span><span class="ig-chip">Globe reference</span></div>
  <h1 class="ig-prompt">{{Territory}}</h1>
  <div class="ig-stage">
    <canvas class="ig-canvas" aria-label="Globe answer with all islands"></canvas>
    <div class="ig-toolbar" role="group" aria-label="Answer globe controls">
      <button class="ig-button" type="button" data-mode="rotate" aria-pressed="true">Rotate</button>
      <button class="ig-button" type="button" data-action="focus">Focus target</button>
    </div>
  </div>
  <div class="ig-result" data-result></div>
  <div class="ig-help">All deck islands are visible; clear labels are shown and the target is highlighted.</div>
</div>
