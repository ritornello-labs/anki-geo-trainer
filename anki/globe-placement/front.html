<div class="ig-card" data-island-globe data-side="front" data-family="place" data-key="{{Key}}">
  <div class="ig-mast"><span>GeoTrainer</span><span class="ig-chip">Globe placement</span></div>
  <h1 class="ig-prompt">{{Territory}}</h1>
  <div class="ig-stage">
    <canvas class="ig-canvas" aria-label="Rotatable globe"></canvas>
    <div class="ig-toolbar" role="group" aria-label="Globe interaction mode">
      <button class="ig-button" type="button" data-mode="rotate" aria-pressed="true">Rotate</button>
      <button class="ig-button" type="button" data-mode="mark" aria-pressed="false">Draw ellipse</button>
      <button class="ig-button" type="button" data-action="clear">Clear</button>
    </div>
  </div>
  <div class="ig-help">Drag across the target's full extent. Drag inside to move it; use the handles to resize.</div>
</div>
